[project]
name = "nonparametric-analysis"
version = "0.1.0"
description = "FastAPI + React 웹 서비스"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "pymannkendall>=1.4.3",
    "scikit-posthocs>=0.12.0",
    "ruptures>=1.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["03_Code/src/nonparametric_analysis"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff.lint]
# ruff 0.16부터 기본 규칙셋이 확장(I/C4/S 등)되었다. 이 프로젝트의 린트 정책은
# 전통적 기본 규칙(E4/E7/E9/F)으로 고정해, ruff 버전이 올라도 흔들리지 않게 명시한다.
# (예: __init__.py의 논리 그룹 주석으로 큐레이팅된 재노출 import는 isort 재정렬 대상 아님)
select = ["E4", "E7", "E9", "F"]
